[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orders"
version = "0.1.0"
description = "Orders FastAPI service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic-settings>=2.0.0",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.13.0",
  "pymysql>=1.1.0",
  "aiomysql>=0.2.0",
  "redis>=5.0.0",
  "cryptography>=46.0.6",
]
optional-dependencies = { dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "build>=1.2.0"
] }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=1.20.0",
]

